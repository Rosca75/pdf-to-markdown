[package]
name = "pdf2md-engine"
description = "PDF to Markdown conversion engine built on pdf_oxide"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "pdf2md_engine"

[[bin]]
name = "pdf2md-cli"
path = "src/bin/pdf2md-cli.rs"

[dependencies]
mimalloc.workspace = true
pdf_oxide.workspace = true
# Only present to pin a compatible version; see workspace Cargo.toml.
office_oxide.workspace = true
rayon.workspace = true
thiserror.workspace = true
serde.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
pdf-fixtures = { path = "../pdf-fixtures" }
serde_json.workspace = true
toml.workspace = true
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "convert"
harness = false
