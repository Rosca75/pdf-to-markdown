[package]
name = "pdf-fixtures"
description = "Dev-only raw PDF writer and deterministic test-corpus generator for PDF2MD"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "pdf_fixtures"

[[bin]]
name = "gen-corpus"
path = "src/bin/gen-corpus.rs"

[dependencies]
flate2 = "1"
md-5 = "0.11"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }

[dev-dependencies]
pdf_oxide = { workspace = true }
office_oxide.workspace = true
