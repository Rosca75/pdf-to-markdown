name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # src-tauri is a workspace member, so the Linux runner needs the Tauri
      # system libraries to compile the workspace (Windows/macOS ship them).
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # tauri::generate_context! needs the frontend dist/ directory to exist.
      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: cargo fmt
        if: matrix.os == 'ubuntu-24.04'
        run: cargo fmt --all --check

      - name: cargo clippy
        if: matrix.os == 'ubuntu-24.04'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Optimised `ci` profile (release without LTO): the corpus and
      # performance tests need release speed; LTO would only slow linking.
      - name: cargo test
        run: cargo test --workspace --profile ci

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
