# Expectations for the PDF2MD corpus (generated by `cargo run -p pdf-fixtures --bin gen-corpus`).
#
# Keys per [[case]]:
#   file             corpus file name
#   about            what makes the file difficult
#   password         optional password used for the conversion
#   expect_error     optional ConvertError code (see crates/pdf2md-engine/src/error.rs)
#   must_contain     substrings the Markdown output must contain
#   must_not_contain substrings the Markdown output must not contain
#   in_order         substrings that must appear in this order
#
# Only assertions that any correct converter must satisfy are listed.

[[case]]
file = "basic_structure.pdf"
about = "Title plus H2/H3 hierarchy by font size and multi-line paragraphs that must be reflowed"
must_contain = [
  "# Annual Report",
  "## Market overview",
  "### Regional results",
  "## Outlook",
  "This report summarises the financial performance of the company during the last fiscal year and outlines the priorities for the coming twelve months.",
  "Europe delivered the highest revenue growth of all regions, while North America contributed the largest absolute profit.",
  "For the coming year we expect stable growth and continued investment in automation.",
]
in_order = ["Annual Report", "Market overview", "Regional results", "Outlook"]

[[case]]
file = "lists.pdf"
about = "Bullets (bullet, en dash, white bullet in a Type0 font), nesting, ordered lists with 1. / 1) / a. markers and hanging-indent wrapped items"
must_contain = [
  "- Prepare the budget forecast for the next quarter, including all regional adjustments and the revised headcount plan.",
  "- Book the meeting room",
  "  - Check projector availability and bring the spare cable for the presentation.",
  "  - Order coffee",
  "- Send the invitations",
  "- dash item one",
  "- dash item two with a long continuation that definitely needs to wrap onto a second line of the page",
  "1. Open the settings dialog and choose the advanced tab where the export options are located.",
  "2. Select the output folder",
  "3. Press the convert button",
  "Alpha point of the parenthesis list",
  "Beta point of the parenthesis list",
  "First lettered sub-step",
  "Second lettered sub-step",
  # A change of numbering style starts a new list (CommonMark: new delimiter).
  "2) Beta point of the parenthesis list\n1. First lettered sub-step",
]
must_not_contain = ["•", "◦"]
in_order = ["Prepare the budget forecast", "Book the meeting room", "Check projector availability", "Send the invitations", "dash item one", "Open the settings dialog", "Select the output folder", "Press the convert button", "Alpha point", "First lettered sub-step"]

[[case]]
file = "emphasis.pdf"
about = "Bold, italic and bold-italic words drawn with separate font resources on one line"
must_contain = [
  "This sentence has **bold**, *italic* and ***bold italic*** words inside it.",
  "**Important:** read the terms before continuing.",
  "A **very important** notice, *not so much*.",
  "Sans text with *oblique emphasis* in the middle.",
]

[[case]]
file = "table_ruled.pdf"
about = "Grid drawn with lines, bold header row on a grey fill, a cell containing a pipe character"
must_contain = [
  "The following table lists the current stock levels.",
  "| --- | --- | --- |",
  "| Widget | 12 | Standard part |",
  "| Gadget \\| Pro | 3 | Ships separately |",
  "| Gizmo | 7 | Out of stock |",
  "Prices exclude VAT and are valid until the end of the month.",
]
in_order = ["The following table lists", "Qty", "Widget", "Gizmo", "Prices exclude VAT"]

[[case]]
file = "table_unruled.pdf"
about = "Column-aligned table with no ruling lines"
must_contain = [
  "Quarterly sales by region are shown below.",
  "| Region | Q1 | Q2 | Q3 |",
  "| --- | --- | --- | --- |",
  "| North | 120 | 135 | 150 |",
  "| South | 98 | 101 | 110 |",
  "| East | 143 | 150 | 162 |",
  "| West | 87 | 90 | 95 |",
  "All figures are in thousands of euros.",
]
in_order = ["Quarterly sales by region", "| Region |", "| North |", "| West |", "All figures are in thousands"]

[[case]]
file = "links.pdf"
about = "URI link annotations over one word, two words (separate runs), a word inside a wrapped paragraph, and a bare URL"
must_contain = [
  "Read the [documentation](https://example.com/docs) for all the details.",
  "Visit [our website](https://example.org/) today.",
  "[portal](https://example.net/support)",
  "https://example.net/page",
]

[[case]]
file = "headers_footers.pdf"
about = "Six pages with a running header that shifts 36pt on even pages, 'Page n of 6' footers, a Confidential footer and bare page numbers on pages 5-6"
must_contain = [
  "Page content marker alpha is unique to this page.",
  "Page content marker bravo is unique to this page.",
  "Page content marker charlie is unique to this page.",
  "Page content marker delta is unique to this page.",
  "Page content marker echo is unique to this page.",
  "Page content marker foxtrot is unique to this page.",
  "Findings on topic alpha",
  "Findings on topic foxtrot",
]
must_not_contain = [
  "ACME Corp",
  "Quarterly Briefing",
  "Confidential",
  "Page 1 of 6",
  "Page 2 of 6",
  "Page 3 of 6",
  "Page 4 of 6",
  "\n5\n",
  "\n6\n",
]
in_order = [
  "Page content marker alpha",
  "Page content marker bravo",
  "Page content marker charlie",
  "Page content marker delta",
  "Page content marker echo",
  "Page content marker foxtrot",
]

[[case]]
file = "margin_jumps.pdf"
about = "Alternating left margins, Letter / A4 / landscape pages, a MediaBox with non-zero origin and a /Rotate 90 page"
must_contain = [
  "Margin marker one opens the first paragraph of this page, which starts at a left margin of 72 points and runs across the whole text area without any surprises.",
  "Margin marker two opens the first paragraph of this page, which starts at a left margin of 108 points and runs across the whole text area without any surprises.",
  "Margin marker three opens the first paragraph of this page, which starts at a left margin of 72 points and runs across the whole text area without any surprises.",
  "Margin marker four opens the first paragraph of this page, which starts at a left margin of 108 points and runs across the whole text area without any surprises.",
  "Margin marker five opens the first paragraph of this page, which starts at a left margin of 122 points and runs across the whole text area without any surprises.",
  "Margin marker six opens the first paragraph of this page, which starts at a left margin of 72 points and runs across the whole text area without any surprises.",
  "A second paragraph on page five confirms that the reading order is preserved.",
  "A second paragraph on page six confirms that the reading order is preserved.",
]
in_order = ["Margin marker one", "Margin marker two", "Margin marker three", "Margin marker four", "Margin marker five", "Margin marker six"]

[[case]]
file = "split_across_pages.pdf"
about = "Paragraph continuing over a page break, a word hyphenated across a page break, in-page line-end hyphenation, and a sentence ending exactly at page end that must not merge with the next page"
must_contain = [
  "therefore decided to extend the review period by two quarters before signing anything.",
  "its packaging meets the international standards required by the customer.",
  "improves the management of the portfolio",
  "was completed on schedule.\n\nTraining for the warehouse staff",
]
must_not_contain = ["inter-", "manage-", "decided to\n", "schedule. Training"]
in_order = ["Logistics review", "decided to extend", "international standards", "completed on schedule", "Training for the warehouse staff"]

[[case]]
file = "two_columns.pdf"
about = "Two-column body under a full-width title; stream order interleaves the columns line by line; left column must precede right column"
must_contain = [
  "Quarterly Newsletter",
  "The left column opens with news about the new office in Lisbon, which will host forty employees from March.",
  "A second item on the left reports that the canteen now serves vegetarian meals every day.",
  "The right column starts with the annual picnic, scheduled for the first Saturday of June.",
  "Finally the right column thanks all volunteers who helped with the charity run.",
]
in_order = [
  "Quarterly Newsletter",
  "The left column opens",
  "A second item on the left",
  "The right column starts",
  "Finally the right column",
]

[[case]]
file = "mixed_graphics.pdf"
about = "Paragraphs interleaved with filled rectangles, Bezier shapes, an image XObject, a form XObject drawing text and a small labelled diagram"
must_contain = [
  "Quarterly diagram",
  "The first paragraph before the graphics describes the situation in a few clear sentences.",
  "The second paragraph sits between the shapes and the image and keeps its sentence together.",
  "Figure 1 form caption",
  "The closing paragraph after the diagram ends the page.",
]
must_not_contain = ["together. Figure 1"]
in_order = [
  "The first paragraph before the graphics",
  "The second paragraph sits between",
  "Figure 1 form caption",
  "The closing paragraph after the diagram",
]

[[case]]
file = "encodings.pdf"
about = "WinAnsi accents, euro, curly quotes, dashes and ellipsis; a /Differences font with glyph names (alpha, uni0416, Euro, emdash); an Identity-H font with ToUnicode carrying Greek, Cyrillic and CJK"
must_contain = [
  "Café résumé naïve Zoë Müller Ångström costs €25 — “quoted” and ‘single’ with en–dash and ellipsis…",
  "Differences: αβγ Жж € and A—B ok",
  "Ελληνικά",
  "Привет мир",
  "日本語のテキスト",
  "中文测试",
  "Mixed Latin and ΑΒΓ in one font.",
]

[[case]]
file = "ligatures.pdf"
about = "Glyphs that ToUnicode / glyph names map to fi, fl and ffi ligature code points (U+FB01, U+FB02, U+FB03)"
must_contain = [
  "The final flow is efficient",
  "The office opens at nine",
  "Second: final flow of efficient staff",
  "Plain fi and fl for comparison",
  # Short unpunctuated lines are separate paragraphs, not one run-on line.
  "The final flow is efficient\n\nThe office opens at nine",
]
must_not_contain = ["ﬁ", "ﬂ", "ﬃ"]

[[case]]
file = "markdown_specials.pdf"
about = "Markdown-significant characters in body text and a paragraph starting with a number and a period"
must_contain = [
  "Use \\* and \\_ carefully: 2 \\* 3 = 6 and snake_case_name should survive.",
  "\\[like this",
  "\\`backticks\\`",
  "\\# Not a heading but a paragraph that merely starts with a hash sign.",
  "1984\\. That year was long ago and the number must not turn into a list.",
  "Final paragraph without anything special.",
]
must_not_contain = ["\n# Not a heading", "\n1984. That year"]

[[case]]
file = "blank_pages.pdf"
about = "Empty, whitespace-only and content-less pages between pages with text"
must_contain = ["First page text.", "Fourth page text after blank pages."]
in_order = ["First page text.", "Fourth page text after blank pages."]

[[case]]
file = "scanned_image_only.pdf"
about = "A single full-page image and no text at all"
expect_error = "no_text_layer"

[[case]]
file = "ocr_invisible_text.pdf"
about = "Full-page image with an invisible (render mode 3) text layer, as produced by OCR software; the text must be extracted"
must_contain = [
  "Invoice number 20481 issued to Contoso Ltd.",
  "Payment is due within thirty days of receipt.",
]
in_order = ["Invoice number 20481", "Payment is due"]

[[case]]
file = "encrypted_user_password.pdf"
about = "RC4-128 (V2/R3) with user password 'secret': opening without a password must be reported"
expect_error = "password_required"

[[case]]
file = "encrypted_user_password.pdf"
about = "RC4-128 with the correct user password"
password = "secret"
must_contain = [
  "Protected Document",
  "This sentence is only readable after the document has been decrypted.",
  "A second paragraph proves that every string and stream is handled.",
]

[[case]]
file = "encrypted_user_password.pdf"
about = "RC4-128 with a wrong password"
password = "not-the-password"
expect_error = "wrong_password"

[[case]]
file = "encrypted_owner_only.pdf"
about = "RC4-128 with an empty user password and an owner password: must open silently"
must_contain = [
  "Protected Document",
  "This sentence is only readable after the document has been decrypted.",
]

[[case]]
file = "encrypted_aes128.pdf"
about = "AES-128 (V4/R4, AESV2 crypt filter) with user password 'secret': opening without a password must be reported"
expect_error = "password_required"

[[case]]
file = "encrypted_aes128.pdf"
about = "AES-128 with the correct user password"
password = "secret"
must_contain = [
  "Protected Document",
  "This sentence is only readable after the document has been decrypted.",
]

[[case]]
file = "malformed_bad_xref.pdf"
about = "Every classic xref offset points to the wrong place; the file must be reconstructed by scanning"
must_contain = [
  "Recovery marker one stays readable even though the file structure is damaged.",
  "Recovery marker two stays readable even though the file structure is damaged.",
  "Recovery marker three stays readable even though the file structure is damaged.",
]
in_order = ["Recovery marker one", "Recovery marker two", "Recovery marker three"]

[[case]]
file = "malformed_truncated.pdf"
about = "File cut in the middle of the last page's content stream, no xref or trailer; earlier pages must still convert"
must_contain = [
  "Recovery marker one stays readable even though the file structure is damaged.",
  "Recovery marker two stays readable even though the file structure is damaged.",
]
in_order = ["Recovery marker one", "Recovery marker two"]

[[case]]
file = "malformed_garbage_prefix.pdf"
about = "300 bytes of junk before the %PDF- header"
must_contain = [
  "Recovery marker one stays readable even though the file structure is damaged.",
  "Recovery marker two stays readable even though the file structure is damaged.",
  "Recovery marker three stays readable even though the file structure is damaged.",
]

[[case]]
file = "malformed_no_eof.pdf"
about = "Missing %%EOF marker"
must_contain = [
  "Recovery marker one stays readable even though the file structure is damaged.",
  "Recovery marker three stays readable even though the file structure is damaged.",
]

[[case]]
file = "not_a_pdf.pdf"
about = "A plain text file with a .pdf extension"
expect_error = "not_a_pdf"

[[case]]
file = "zero_bytes.pdf"
about = "An empty file"
expect_error = "not_a_pdf"

[[case]]
file = "corrupt_stream.pdf"
about = "Three pages; page 2 has invalid Flate data. Pages 1 and 3 must still convert"
must_contain = [
  "Recovery marker one stays readable even though the file structure is damaged.",
  "Recovery marker three stays readable even though the file structure is damaged.",
]
must_not_contain = ["Recovery marker two"]
in_order = ["Recovery marker one", "Recovery marker three"]

[[case]]
file = "tj_kerning.pdf"
about = "TJ arrays where large negative kerning acts as word spacing, small kerning inside words, and a line drawn glyph by glyph with individual Td moves"
must_contain = [
  "Normal paragraph before the kerned lines.",
  "Hello world from kerning arrays.",
  "WARNING do not touch",
  "Glyph by glyph text",
  "Normal paragraph after the kerned lines.",
  "Hello world from kerning arrays.\n\nWARNING do not touch",
]
in_order = ["Normal paragraph before", "Hello world", "WARNING do not touch", "Glyph by glyph text", "Normal paragraph after"]

[[case]]
file = "rotated_margin_text.pdf"
about = "Vertical stamp text in the left margin spanning the same y range as the body; it must not interleave with body lines"
must_contain = [
  "Status memo",
  "The first body paragraph explains the purpose of the document in plain words and stays intact despite the stamp in the margin next to it.",
  "The second body paragraph describes the current state of the project: all milestones were reached and the remaining budget is sufficient.",
  "The third body paragraph lists the next steps and thanks everyone who contributed to the memo.",
]
in_order = ["The first body paragraph", "The second body paragraph", "The third body paragraph"]

[[case]]
file = "object_streams.pdf"
about = "PDF 1.5 cross-reference stream and object streams (dictionaries packed into compressed streams), plus a link annotation"
must_contain = [
  "# Compact structure",
  "This document uses a cross-reference stream and object streams, as produced by modern writers.",
  "[Compact link target](https://example.com/compact)",
  "Second compact page",
  "The second page is stored in the same object stream.",
]
in_order = ["Compact structure", "Second compact page"]

[[case]]
file = "incremental_update.pdf"
about = "Second revision appended with a new xref section replaces page 1's content; the new text must win"
must_contain = [
  "Revised first page text that replaces the original wording.",
  "The second page stays untouched by the update.",
]
must_not_contain = ["Original first page text"]
in_order = ["Revised first page text", "The second page stays untouched"]

[[case]]
file = "code_block.pdf"
about = "Courier lines with leading indentation must become a fenced code block with indentation preserved"
must_contain = [
  "The following program prints a number when it is large enough:",
  "```\nfn main() {\n    let x = 42;\n    if x > 1 {\n        println!(\"{}\", x);\n    }\n}\n```",
  "After the listing the normal text continues here.",
]
in_order = ["The following program", "fn main() {", "After the listing"]

[[case]]
file = "fake_bold_overprint.pdf"
about = "Text drawn twice with a 0.3pt offset to fake bold; each string must appear exactly once"
must_contain = [
  "Fake Bold Heading",
  "This sentence is overprinted to look bold.",
  "This sentence is printed normally, once.",
]
must_not_contain = [
  "Fake Bold HeadingFake Bold Heading",
  "Fake Bold Heading Fake Bold Heading",
  "FFaakkee",
  "This sentence is overprinted to look bold.This sentence is overprinted to look bold.",
  "This sentence is overprinted to look bold. This sentence is overprinted to look bold.",
  "TThhiiss",
]

[[case]]
file = "title_page.pdf"
about = "Huge title, subtitle and author line alone on page 1 (no terminal punctuation), body starting on page 2; the title page must not merge into the body"
must_contain = [
  "# Market Study 2026",
  "Prospects for the Mid-Size Segment",
  "Prepared by Jane Doe",
  "Executive summary",
  "The mid-size segment is expected to outgrow the overall market over the next three years.",
  "Our analysis is based on interviews with forty industry experts and on a review of public filings.",
]
must_not_contain = ["Doe Executive", "Doe The mid-size"]
in_order = ["Market Study 2026", "Prospects for the Mid-Size Segment", "Prepared by Jane Doe", "Executive summary", "The mid-size segment is expected"]
